<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 60px auto; text-align: center; }
        img.avatar { border-radius: 50%; width: 96px; height: 96px; }
        a { color: #0366d6; }
    </style>
</head>
<body>
    <h1>GitHub Profile</h1>

    <img class="avatar" th:src="${avatar}" th:alt="${login}" />
    <h2 th:text="${name != null ? name : login}">Username</h2>
    <p>GitHub login: <strong th:text="${login}">login</strong></p>

    <form th:action="@{/logout}" method="post">
        <button type="submit">Logout</button>
    </form>
    <br/>
    <a th:href="@{/}">Back to Home</a>
</body>
</html>
